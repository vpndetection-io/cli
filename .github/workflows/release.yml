name: Release

# A v* tag is the release. The version in main.go is the source of truth for
# what gets built; the tag is checked against it below, because the tag only
# triggers this and a mismatch would otherwise ship the wrong number.
on:
  push:
    tags: ['v*']
  # So a flaky GitHub API does not cost a version number: re-tagging to retry a
  # transient 500 is worse than re-running. `all` rebuilds the archives and moves
  # ghcr's `latest` and the tap, so it is for the NEWEST tag only. `chocolatey`
  # re-pushes that package alone, packed from this branch rather than the tag.
  # `dockerhub` copies the tag's ghcr image to Docker Hub and moves its `latest`,
  # so it too is for the newest tag, and sets the page from this branch.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, e.g. v0.2.0
        required: true
      channel:
        description: all, or one channel to re-publish for an existing release
        type: choice
        options: [all, chocolatey, dockerhub]
        default: all

permissions:
  contents: write
  packages: write

jobs:
  # Its own job so the packaging below does not depend on the GitHub release API
  # being healthy. That API returned 500 for twenty minutes on 0.2.0, and because
  # every other job hung off `needs: release`, the container image, the tap, the
  # Chocolatey package and the winget PR were all skipped over a problem that had
  # nothing to do with any of them.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vsn.outputs.version }}
      tag: ${{ steps.vsn.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # check-versions.sh confirms each CHANGELOG.md line links a commit in
          # this tag's history, which a shallow clone does not have.
          fetch-depth: 0
      - name: Check the tag against the version in main.go
        id: vsn
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          src="$(grep -m1 'var version = ' main.go | cut -d'"' -f2)"
          if [ "${tag#v}" != "$src" ] ; then
            echo "tag ${tag} does not match main.go version ${src}" >&2
            exit 1
          fi
          echo "version=${src}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      # Every other job needs this one, so a stale version string fails the
      # release before anything is built, published or pushed to a tap.
      - name: Check every version string against the tag
        run: ./scripts/check-versions.sh "${{ steps.vsn.outputs.version }}"

  release:
    needs: version
    # Skipped by a chocolatey-only dispatch, and with it every job that needs it.
    if: github.event_name == 'push' || inputs.channel == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - run: go test ./...

      - name: Build and package
        run: ./scripts/build-archive-all.sh "${{ needs.version.outputs.version }}"

      # go test ran the source, and the archives are built after it with flags
      # of their own, so nothing else here runs a binary anyone downloads: the
      # one this runner can execute is run out of the archive that ships it.
      - name: Run the linux/amd64 binary from its archive
        run: |
          vsn="${{ needs.version.outputs.version }}"
          tar -xzf "build/vpndetection_${vsn}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          got="$("$RUNNER_TEMP/vpndetection" version)"
          if [ "$got" != "$vsn" ] ; then
            echo "the linux/amd64 archive's binary reports ${got}, not ${vsn}" >&2
            exit 1
          fi

      - name: Stamp the installers with this version
        run: |
          vsn="${{ needs.version.outputs.version }}"
          sed -i "s/^VSN=\"\${VSN:-.*}\"/VSN=\"\${VSN:-${vsn}}\"/" dist/macos.sh dist/deb.sh
          sed -i "s/else { \"[0-9.]*\" }/else { \"${vsn}\" }/" dist/windows.ps1
          cp dist/macos.sh dist/deb.sh dist/windows.ps1 build/

      # The release's notes are this version's CHANGELOG.md section, which
      # check-versions.sh already required in the version job.
      - name: Cut this version's CHANGELOG.md section
        run: |
          vsn="${{ needs.version.outputs.version }}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$vsn" '/^## /{ if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > "$notes"
          if ! grep -q '^### ' "$notes" ; then
            echo "CHANGELOG.md has no section for ${vsn}" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            build/*.tar.gz
            build/*.zip
            build/*.deb
            build/macos.sh
            build/deb.sh
            build/windows.ps1
          body_path: ${{ runner.temp }}/notes.md

  docker:
    needs: version
    if: github.event_name == 'push' || inputs.channel == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      # Built for ghcr alone, with the token this workflow already has; the
      # dockerhub job copies the result, so Docker Hub cannot cost this image.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          # Without this the image reports `version: dev`, because the
          # Dockerfile's ARG defaults to it and nothing was passing the real
          # one. The binary in a release archive was right and the one in the
          # container was not, which is the kind of difference nobody notices
          # until they are reading a bug report.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          # A multi-arch image's description on GitHub's package page is its
          # index's annotation, which no Dockerfile LABEL reaches.
          annotations: |
            index:org.opencontainers.image.description=Official CLI for the VPNDetection API (https://vpndetection.io). Look up VPNs, proxies, Tor, hosting and CDN ranges. Docs: https://docs.vpndetection.io/integrations/cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vpndetection-io/cli:${{ needs.version.outputs.version }}
            ghcr.io/vpndetection-io/cli:latest

  # Docker Hub is where people search for images, and its page links the site
  # and the docs. The image is ghcr's, copied by digest rather than rebuilt.
  dockerhub:
    needs: [version, docker]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
      (needs.docker.result == 'success' || inputs.channel == 'dockerhub') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - id: guard
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ] ; then
            echo "::warning title=Docker Hub skipped::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is unset, so ${{ needs.version.outputs.tag }} was not published to Docker Hub"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      # No ref, as for Chocolatey: a dispatch sets the page from this branch.
      - if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.guard.outputs.configured == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.guard.outputs.configured == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.guard.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.guard.outputs.configured == 'true'
        name: Copy the image from ghcr
        env:
          VSN: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "docker.io/vpndetection/cli:${VSN}" \
            --tag docker.io/vpndetection/cli:latest \
            "ghcr.io/vpndetection-io/cli:${VSN}"
      - if: steps.guard.outputs.configured == 'true'
        name: Set the Docker Hub page
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: ./scripts/update-dockerhub.sh

  homebrew:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the tap formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VSN: ${{ needs.version.outputs.version }}
        # Skipped rather than failed when the key is absent, so a release still
        # completes on a fork.
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ] ; then
            echo "::warning title=Homebrew skipped::TAP_DEPLOY_KEY is unset, so the tap formula was not updated"
            exit 0
          fi
          ./scripts/update-homebrew.sh "$VSN"

  winget:
    needs: [version, release]
    runs-on: windows-latest
    steps:
      # Unconfigured and broken are different things, and neither may be silent:
      # a skipped channel is GREEN, and `continue-on-error` used to swallow the
      # real failure underneath it.
      - id: guard
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ] ; then
            echo "::warning title=winget skipped::WINGET_TOKEN is unset, so ${{ needs.version.outputs.tag }} was not submitted to winget-pkgs"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      # vedantmgoyal2009 was renamed to vedantmgoyal9; the old path only still
      # resolves through GitHub's rename redirect. Pinned to the commit v2 named
      # until 2026-10-07, when v2 moved to a rewrite whose action.yml does not
      # load (vedantmgoyal9/winget-releaser#345). A moved tag hands the token to
      # code nobody here has read, so move this pin by hand.
      - if: steps.guard.outputs.configured == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e
        with:
          identifier: VPNDetection.CLI
          installers-regex: '_windows_\w+\.zip$'
          version: ${{ needs.version.outputs.version }}
          token: ${{ secrets.WINGET_TOKEN }}
      # winget-pkgs labels Needs-CLA on every PR whose author's association is
      # NONE, as this account's stayed through three merged PRs, and lifts it
      # only for an agree its author posts after the label. komac exits 0 in CI
      # on a version with an open PR, so a re-run answers that PR here.
      - if: steps.guard.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          BRANCH: VPNDetection.CLI-${{ needs.version.outputs.version }}-
        run: |
          set -euo pipefail
          query='{ viewer { pullRequests(first: 20, states: OPEN, orderBy: {field: CREATED_AT, direction: DESC}) { nodes { number headRefName repository { nameWithOwner } labels(first: 20) { nodes { name } } } } } }'
          pick='[.data.viewer.pullRequests.nodes[] | select(.repository.nameWithOwner == "microsoft/winget-pkgs" and (.headRefName | startswith(env.BRANCH)))][0] // empty | "\(.number) \(any(.labels.nodes[]; .name == "Needs-CLA"))"'
          pr='' cla=''
          poll() {
            read -r pr cla <<< "$(gh api graphql -f query="$query" --jq "$pick")"
          }
          for _ in $(seq 60) ; do
            poll
            if [ "$cla" = true ] ; then
              break
            fi
            sleep 10
          done
          if [ "$cla" != true ] ; then
            echo "::notice::No open PR for ${BRANCH%-} read Needs-CLA in 10 minutes${pr:+ (#$pr)}, so none needs an agree"
            exit 0
          fi
          num="$pr"
          gh pr comment "$num" --repo microsoft/winget-pkgs --body '@microsoft-github-policy-service agree'
          for _ in $(seq 18) ; do
            sleep 10
            poll
            if [ "$cla" = false ] ; then
              echo "::notice::#$num agreed to the CLA, and its Needs-CLA is gone"
              exit 0
            fi
          done
          echo "::error::#$num still reads Needs-CLA 3 minutes after its agree"
          exit 1

  chocolatey:
    needs: [version, release]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
      (needs.release.result == 'success' || inputs.channel == 'chocolatey') }}
    runs-on: windows-latest
    steps:
      # No ref: a tag push packs the tag's tree and a dispatch this branch's, which
      # is how a nuspec fix reaches a version moderation wants resubmitted as-is.
      - uses: actions/checkout@v7
      - name: Push the Chocolatey package
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          VSN: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          if (-not $env:CHOCO_API_KEY) {
            Write-Host "::warning title=Chocolatey skipped::CHOCO_API_KEY is unset, so $env:VSN was not pushed to Chocolatey"
            exit 0
          }
          ./scripts/update-chocolatey.ps1 -Version $env:VSN -ApiKey $env:CHOCO_API_KEY
